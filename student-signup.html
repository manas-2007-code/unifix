<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFix | Student Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="form-page">
    <main class="form-card">
        <img src="assets/unifixlogo.png" alt="UniFix logo" class="logo small-logo">
        <h1>Student Sign Up</h1>
        <p class="muted">Create your student account.</p>

        <form id="studentSignupForm">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" required>

            <label for="studentEmail">Email</label>
            <input type="email" id="studentEmail" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" required>

            <label for="studentCourse">Course</label>
            <input type="text" id="studentCourse" placeholder="Example: B.Tech" required>

            <label for="studentBranch">Branch</label>
            <input type="text" id="studentBranch" placeholder="Example: CSE" required>

            <label for="studentYear">Year</label>
            <select id="studentYear" required>
                <option value="">Select year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <label for="studentPassword">Password</label>
            <input type="password" id="studentPassword" required minlength="4">

            <label for="studentConfirmPassword">Confirm Password</label>
            <input type="password" id="studentConfirmPassword" required minlength="4">

            <button type="submit" class="button">Create Student Account</button>
            <p id="studentSignupMessage" class="message"></p>
        </form>

        <p class="back-link"><a href="index.html">Back to Login</a></p>
    </main>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
