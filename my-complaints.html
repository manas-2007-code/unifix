<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFix | My Complaints</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <img src="assets/unifixlogo.png" alt="UniFix logo" class="sidebar-logo">
            <p class="menu-title">STUDENT MENU</p>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="report-issue.html">Report an Issue</a>
            <a class="active" href="my-complaints.html">My Complaints</a>
            <button id="studentLogout" class="logout-button">Logout</button>
        </aside>

        <main class="main-content">
            <header class="topbar"><h1>My Complaints</h1><p>View the complaints you have submitted.</p></header>
            <section class="panel">
                <div class="search-row">
                    <label for="complaintSearch">Search by issue</label>
                    <input type="text" id="complaintSearch" placeholder="Type an issue name">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>Issue</th><th>Category</th><th>Location</th><th>Date</th><th>Status</th></tr></thead>
                        <tbody id="myComplaintsTable"></tbody>
                    </table>
                </div>
                <p id="noComplaints" class="muted">No complaints found.</p>
            </section>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
