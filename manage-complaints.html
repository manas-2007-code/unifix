<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFix | Manage Complaints</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <img src="assets/unifixlogo.png" alt="UniFix logo" class="sidebar-logo">
            <p class="menu-title">ADMINISTRATION</p>
            <a href="admin-dashboard.html">Dashboard</a>
            <a class="active" href="manage-complaints.html">Manage Complaints</a>
            <button id="adminLogout" class="logout-button">Logout</button>
        </aside>

        <main class="main-content">
            <header class="topbar"><h1>Manage Complaints</h1><p>Update complaint status.</p></header>
            <section class="panel">
                <div class="search-row">
                    <label for="adminSearch">Search complaint</label>
                    <input type="text" id="adminSearch" placeholder="Search by ID or issue">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>Student</th><th>Issue</th><th>Location</th><th>Status</th><th>Update</th></tr></thead>
                        <tbody id="manageComplaintsTable"></tbody>
                    </table>
                </div>
                <p id="adminEmptyMessage" class="muted">No complaints are available.</p>
            </section>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
